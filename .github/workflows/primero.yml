# separate terms of service, privacy policy, and support
# documentation.

name: Ci para SistemaVentas

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
  security-events: write
  id-token: write
  packages: write
jobs:
  build:

    runs-on: ubuntu-latest
    services:
      producto-db:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: productodb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U $$POSTGRES_USER"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
    - uses: actions/checkout@v6.1.0
    - name: Set up JDK 25
      uses: actions/setup-java@v6.2.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven solo los módulos (sin tests)
      run: mvn -B -pl producto-service,pedido-service -am clean package -DskipTests
    # --------------------------------------------------------
    #  Levantar PRODUCTO-SERVICE
    # --------------------------------------------------------
    - name: Inicializando producto-service
      env:
        SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
        SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        cd producto-service
        nohup java -jar target/*.jar \
        --server.port=7070 \
        --spring.datasource.url=jdbc:postgresql://localhost:5432/productodb \
        > ../logs/producto-service.log 2>&1 &
    - name: Esperar hasta que el servicio esté listo
      run: sleep 25
